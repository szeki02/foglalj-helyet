<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Foglalj helyet :)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,700;0,800;1,400&family=Atkinson+Hyperlegible+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: one-screen site board. 3D yard fills the stage, a phase sheet sits to the right (below on phones),
   the build timeline runs along the bottom like a tape measure. */
:root {
  --bg: #e7e9e4;          /* poured concrete, faint green bias */
  --surface: #f5f6f2;
  --fg: #1c2320;
  --muted: #59635c;
  --line: #c6ccc3;
  --accent: #2d5a74;      /* pavilion steel, painted blue-grey */
  --accent-ink: #f5f6f2;
  --warn: #b5532f;        /* the presenter's clock, over time */
  --sky: #dde3e1;
  --ground: #cdd2ca;
  --font-display: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-mono: "Atkinson Hyperlegible Mono", ui-monospace, Consolas, monospace;
  --step--1: 0.8125rem;
  --step-0: 1rem;
  --step-1: 1.25rem;
  --step-2: 1.75rem;
  --step-3: 2.6rem;
  --radius: 4px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141816; --surface: #1c211f; --fg: #e5e9e3; --muted: #9ba69e; --line: #313834;
    --accent: #84b5d1; --accent-ink: #141816; --warn: #e8946a; --sky: #181d1b; --ground: #252a27; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141816; --surface: #1c211f; --fg: #e5e9e3; --muted: #9ba69e; --line: #313834;
  --accent: #84b5d1; --accent-ink: #141816; --warn: #e8946a; --sky: #181d1b; --ground: #252a27; color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: var(--step-0); line-height: 1.5; }

.app {
  position: fixed; inset: 0;
  padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(290px, 340px);   /* the model gets the room */
  grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-areas: "tabs tabs" "stage sheet" "time time";
}
/* ---------- tabs: your yard (opens first), the timeline with its pictures, the presentation ---------- */
.tabs {
  grid-area: tabs; display: flex; align-items: stretch; gap: 4px; padding: 0 12px; min-width: 0; overflow-x: auto;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.tabs-brand { align-self: center; font: 800 1.05rem/1 var(--font-display); margin-right: 14px; white-space: nowrap; }
.tab {
  font: 600 var(--step--1)/1 var(--font-body); color: var(--muted); background: none; border: 0; cursor: pointer;
  padding: 13px 12px 11px; border-bottom: 3px solid transparent; white-space: nowrap;
}
.tab:hover { color: var(--fg); }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -4px; }
html:fullscreen .tabs { display: none; }
.sound-toggle {
  margin-left: auto; align-self: center; flex: none; font: 600 var(--step--1)/1 var(--font-body); color: var(--fg);
  background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; white-space: nowrap;
}
.sound-toggle:hover { border-color: var(--fg); }
.sound-toggle[aria-pressed="true"], #pSound[aria-pressed="true"], #soundHud[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.sound-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sound-credit {                                  /* the music's credit (CC BY), while it can be heard */
  position: absolute; left: 12px; bottom: 10px; z-index: 3; max-width: calc(100% - 24px);
  font: 400 0.7rem/1.3 var(--font-mono); color: #f5f6f2; background: rgb(20 24 22 / .6); padding: 3px 8px; border-radius: 4px;
}
.sound-credit a { color: inherit; }
.app.presenting .sound-credit { bottom: auto; top: 10px; }        /* projecting: the slides only */
.app[data-tab="yard"] .time { display: none; }  /* your yard is a place of its own, not a stop on the timeline */
.app[data-tab="yard"] .gal-open { display: none; }

/* ---------- stage ---------- */
.stage { grid-area: stage; position: relative; min-width: 0; min-height: 0; background: var(--sky); overflow: hidden; }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.stage:focus-within canvas { outline: none; }

/* Colour is kept for what is in hand: the current stage (its timeline mark, its area in the model, its number) and
   the main actions (play, all workshops, watch it being built, the yard's buttons). Everything else is neutral. */
.hud { position: absolute; display: flex; gap: 8px; align-items: center; }
.hud-tl { top: 12px; left: 12px; }
.hud-br { right: 12px; bottom: 12px; flex-direction: column; align-items: flex-end; }

.compass { width: 44px; height: 44px; border-radius: 50%; background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; }
.compass svg { width: 34px; height: 34px; transition: transform .05s linear; }

.chipbtn {
  font: 500 var(--step--1)/1 var(--font-body); color: var(--fg); background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--radius); padding: 7px 10px; cursor: pointer;
}
.chipbtn:hover { border-color: var(--fg); }
.chipbtn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chipbtn.primary:hover { filter: brightness(1.08); }
.chipbtn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chipbtn:focus-visible, .tbtn:focus-visible, .tick:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* your yard: turning the piece in hand, right on the model (shown only while something is picked up) */
.rotbtn {
  width: 48px; height: 48px; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center;
  background: var(--accent); color: var(--accent-ink); font: 700 1.6rem/1 var(--font-body);
  box-shadow: 0 3px 12px rgb(0 0 0 / .25); touch-action: manipulation;
}
.rotbtn:hover { filter: brightness(1.08); }
.rotbtn:active { transform: rotate(45deg); transition: transform .12s; }
.rotbtn:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
.layers { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; display: grid; gap: 4px; font-size: var(--step--1); }
.layers label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.layers input { accent-color: var(--accent); margin: 0; }

.loading {
  position: absolute; inset: 0; display: grid; place-items: center; background: var(--sky);
  font: 500 var(--step--1)/1.4 var(--font-mono); color: var(--muted); text-align: center; padding: 16px;
}
.loading .bar { width: min(240px, 60vw); height: 3px; background: var(--line); margin: 10px auto 0; }
.loading .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s; }

/* ---------- sheet ---------- */
.sheet {
  grid-area: sheet; min-width: 0; overflow-y: auto; background: var(--surface); border-left: 1px solid var(--line);
  padding: 18px 18px 22px; display: flex; flex-direction: column; gap: 18px;
}
.eyebrow { font: 500 var(--step--1)/1.3 var(--font-mono); color: var(--muted); }
.brand-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.lang-switch { display: inline-flex; flex: none; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.lang-switch button {
  font: 500 0.72rem/1 var(--font-mono); padding: 6px 10px; border: 0; cursor: pointer;
  background: var(--surface); color: var(--muted);
}
.lang-switch button[aria-pressed="true"] { background: var(--fg); color: var(--surface); }
.lang-switch button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.gal-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.brand h1 { font: 800 1.85rem/1.05 var(--font-display); margin: 6px 0 8px; text-wrap: balance; }
.brand p { margin: 0; color: var(--muted); max-width: 34ch; }
.status { display: inline-block; margin-top: 10px; font: 500 0.75rem/1 var(--font-mono); padding: 5px 8px; border: 1px dashed var(--muted); color: var(--muted); border-radius: var(--radius); }

.phase { display: flex; flex-direction: column; gap: 12px; border-top: 2px solid var(--fg); padding-top: 16px; }
.phase-head { display: flex; align-items: baseline; gap: 12px; }
.phase-num { font: 800 3rem/0.85 var(--font-display); color: var(--pc, var(--fg)); min-width: 1ch; }
.phase-when { font: 500 var(--step--1)/1.3 var(--font-mono); color: var(--muted); }
.phase h2 { font: 700 1.5rem/1.15 var(--font-display); margin: 2px 0 0; text-wrap: balance; }
.phase p { margin: 0; max-width: 60ch; }

.lists { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.lists h3, .legend h3 { font: 500 var(--step--1)/1.3 var(--font-mono); color: var(--muted); margin: 0 0 6px; }
.lists ul { margin: 0; padding-left: 1.1em; display: grid; gap: 3px; font-size: 0.94rem; }
.lists > div { min-width: 0; }

.legend { display: grid; gap: 10px; }
.legend-row { display: grid; grid-template-columns: 14px 1fr; gap: 10px; align-items: start; }
.legend-row i { width: 14px; height: 14px; border-radius: 50%; background: var(--muted); margin-top: 4px; }
.legend-row b { display: block; }
.legend-row span { color: var(--muted); font-size: 0.94rem; }
.legend-row.zone i { border-radius: 3px; }
.legend-row .zn { font: 800 1.1rem/1 var(--font-display); color: var(--muted); }
.legend-row.zone { grid-template-columns: 22px 1fr; }

.cost { display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 14px; }
.cost h3 { font: 500 var(--step--1)/1.3 var(--font-mono); color: var(--muted); margin: 0; }
.cost-figs { display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: baseline; }
.cost-figs div { display: grid; }
.cost-figs b { font: 800 1.5rem/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.cost-figs .new b { font-size: 1.15rem; color: var(--muted); }
.cost-figs span { font: 400 0.75rem/1.4 var(--font-mono); color: var(--muted); }
.mats { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 0.9rem; }
.mats li { display: grid; grid-template-columns: minmax(0, 1fr); padding-left: 12px; border-left: 2px solid var(--line); }
.mats em { font-style: normal; font-size: 0.8rem; color: var(--muted); }
.cost-note { margin: 0; font-size: 0.82rem; color: var(--muted); }
.budget-wrap { overflow-x: auto; }
.budget { width: 100%; border-collapse: collapse; font-size: 0.88rem; font-variant-numeric: tabular-nums; }
.budget th { font: 500 0.72rem/1.3 var(--font-mono); color: var(--muted); text-align: right; padding: 0 0 6px; }
.budget th:first-child, .budget td:first-child { text-align: left; }
.budget td { text-align: right; padding: 5px 0; border-top: 1px solid var(--line); white-space: nowrap; }
.budget td:first-child { white-space: normal; padding-right: 10px; }
.budget td + td { padding-left: 12px; }
.budget .zn { display: inline-block; width: 1.4em; font: 800 1rem/1 var(--font-display); color: var(--muted); }
.budget tfoot td { font-weight: 700; border-top: 2px solid var(--fg); }
.budget tfoot .eur td { font-weight: 400; color: var(--muted); border-top: 0; padding-top: 0; font-size: 0.8rem; }
.footnote { font-size: 0.8rem; color: var(--muted); margin-top: auto; border-top: 1px solid var(--line); padding-top: 12px; }
.footnote code { font-family: var(--font-mono); font-size: 0.78rem; }

/* ---------- timeline ---------- */
.time {
  grid-area: time; background: var(--bg); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center;
  padding: 4px 16px 6px;
}
.tbtns { display: flex; gap: 6px; }
.tbtn {
  width: 38px; height: 38px; display: grid; place-items: center; border-radius: 50%;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer;
}
.tbtn:hover { border-color: var(--fg); }
.tbtn.play { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tbtn svg { width: 16px; height: 16px; fill: currentColor; }

.track { position: relative; height: 46px; min-width: 0; }
.tl-body { min-width: 0; --cols: 10; --gap: 6px; }
.tl-body .track { margin-inline: calc((100% - (var(--cols) - 1) * var(--gap)) / var(--cols) / 2); }
.tl-strip { list-style: none; margin: 0; padding: 6px 0 0; display: grid; gap: var(--gap); grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); }
.tcard {
  display: grid; gap: 3px; width: 100%; padding: 0; margin: 0; border: 0; background: none; cursor: pointer; text-align: left; color: var(--muted);
  font: inherit; min-width: 0;
}
.tc-img { position: relative; display: block; aspect-ratio: 4 / 3; max-width: 100%; background: var(--sky); border-radius: 3px; overflow: hidden;
  outline: 1px solid var(--line); outline-offset: -1px; }
.tc-img img { display: block; width: 100%; height: 100%; object-fit: cover; }
.tc-cap { font: 500 0.7rem/1.2 var(--font-body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tc-cap b { font: 800 0.78rem/1 var(--font-display); color: var(--fg); margin-right: 3px; }
.tcard:hover .tc-img { outline: 2px solid var(--fg); outline-offset: -2px; }
.tcard.on .tc-img { outline: 3px solid var(--accent); outline-offset: -3px; }
.tcard.on .tc-cap { color: var(--fg); font-weight: 700; }
.tcard:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tl-body .tick .tl { display: none; }           /* the pictures above carry the names */
.rule { position: absolute; left: 0; right: 0; top: 12px; height: 12px; border-bottom: 1.5px solid var(--fg);
  background-image: repeating-linear-gradient(90deg, var(--muted) 0 1px, transparent 1px 100%);
  background-size: calc(100% / 70) 5px; background-repeat: repeat-x; background-position: 0 100%; }
.fill { position: absolute; left: 0; top: 22px; height: 4px; background: var(--muted); opacity: .55; width: 0; }
.ticks { position: absolute; inset: 0; }
.tick {
  position: absolute; top: 0; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center;
  gap: 4px; background: none; border: 0; padding: 0; cursor: pointer; color: var(--muted); font: inherit;
}
.tick .tn { display: none; }
.tick .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px solid var(--muted); margin-top: 21px; }
.tick .tl { font-size: 0.75rem; white-space: nowrap; margin-top: 4px; visibility: hidden; }   /* only the stage in hand */
.tick.on .tl, .tick:hover .tl, .tick:focus-visible .tl { visibility: visible; }
.tick:hover .tn, .tick:hover .tl { color: var(--fg); }
.tick.past .dot { background: var(--muted); }
.tick.on .tn { color: var(--tc, var(--fg)); }
.tick.on .dot { background: var(--tc, var(--fg)); border-color: var(--tc, var(--fg)); transform: scale(1.35); box-shadow: 0 0 0 3px var(--bg); }
.tick.on .tl { color: var(--fg); font-weight: 700; }
.tick.mid .dot { width: 8px; height: 8px; border-radius: 1px; margin-top: 23px; transform: rotate(45deg); }
.tick.mid.on .dot { transform: rotate(45deg) scale(1.4); }
.phase-num.mid { color: transparent; -webkit-text-stroke: 1.5px var(--pc); }
.onsite h3 { font: 500 var(--step--1)/1.3 var(--font-mono); color: var(--muted); margin: 0 0 6px; }
.onsite ul { margin: 0; padding-left: 1.1em; display: grid; gap: 4px; font-size: 0.94rem; }
.thumb {
  position: absolute; top: 8px; width: 4px; height: 26px; margin-left: -2px; background: var(--fg); border-radius: 2px; pointer-events: none;
}
#scrub { position: absolute; left: 0; right: 0; top: 4px; height: 34px; width: 100%; margin: 0; opacity: 0; cursor: grab; }
#scrub:active { cursor: grabbing; }
#scrub:focus-visible + .thumb { outline: 2px solid var(--accent); outline-offset: 3px; }
.tread { font: 500 var(--step--1)/1.25 var(--font-mono); color: var(--muted); text-align: right; min-width: 9ch; font-variant-numeric: tabular-nums; }
.tread b { display: block; color: var(--fg); font-weight: 500; }

/* ---------- gallery: every stage as a card, pictures drawn from the model ---------- */
.chipbtn.gal-open { display: inline-flex; align-items: center; gap: 7px; }
.chipbtn.gal-open svg { width: 13px; height: 13px; fill: currentColor; }
.gallery {
  position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow-y: auto; overscroll-behavior: contain;
  padding-block: calc(env(safe-area-inset-top, 0px) + 20px) calc(env(safe-area-inset-bottom, 0px) + 32px);
}
.gal-inner { max-width: 1240px; margin: 0 auto; padding-inline: clamp(16px, 3vw, 32px); display: grid; gap: 18px; }
.gal-head {
  display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 20px;
  border-bottom: 2px solid var(--fg); padding-bottom: 14px;
}
.gal-head h2 { font: 800 2.2rem/1.05 var(--font-display); margin: 6px 0 6px; text-wrap: balance; }
.gal-head p { margin: 0; color: var(--muted); max-width: 52ch; }
.gal-filter { display: flex; flex-wrap: wrap; gap: 6px; }
.gal-filter button {
  display: inline-flex; align-items: center; gap: 6px; font: 500 var(--step--1)/1.2 var(--font-body); color: var(--fg);
  padding: 5px 11px 5px 9px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); cursor: pointer;
}
.gal-filter button i { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
.gal-filter button[aria-pressed="true"] { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); font-weight: 700; }
.gal-filter button[aria-pressed="true"] i { background: var(--mc, var(--fg)); }
.gal-filter button:focus-visible, .gcard-main:focus-visible, .gbuild:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.gal-grid {
  list-style: none; margin: 0; padding: 0; display: grid; gap: 18px;
  grid-template-columns: repeat(auto-fill, minmax(min(270px, 100%), 1fr));
}
.gcard {
  display: flex; flex-direction: column; min-width: 0; background: var(--surface);
  border: 1px solid var(--line); border-top: 4px solid var(--line); border-radius: var(--radius); overflow: hidden;
  transition: border-color .2s, box-shadow .2s;
}
.gcard:hover, .gcard:focus-within { border-color: var(--pc, var(--fg)); box-shadow: 0 4px 16px rgb(0 0 0 / .10); }
.gcard:hover .gnum, .gcard:focus-within .gnum, .gcard.here .gnum { color: var(--pc, var(--fg)); }
.gcard-main {
  display: flex; flex-direction: column; text-align: left; padding: 0; margin: 0; border: 0; background: none;
  color: inherit; font: inherit; cursor: pointer; min-width: 0;
}
.gthumb { position: relative; aspect-ratio: 4 / 3; max-width: 100%; background: var(--sky); overflow: hidden; }
.gthumb img { display: block; width: 100%; height: 100%; object-fit: cover; transition: transform .35s; }
.gcard:hover .gthumb img { transform: scale(1.03); }
.gwait { position: absolute; inset: 0; display: grid; place-items: center; font: 500 0.75rem/1.3 var(--font-mono); color: var(--muted); }
.gflag {
  position: absolute; left: 8px; top: 8px; font: 500 0.7rem/1 var(--font-mono);
  background: var(--surface); color: var(--muted); border: 1px dashed var(--muted); border-radius: var(--radius); padding: 4px 6px;
}
.gbody { padding: 12px 14px 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0 12px; align-items: start; }
.gbody.nonum { grid-template-columns: minmax(0, 1fr); }
.gnum { font: 800 2.4rem/0.85 var(--font-display); color: var(--muted); min-width: 1ch; transition: color .2s; }
.gmeta { font: 500 0.75rem/1.3 var(--font-mono); color: var(--muted); }
.gbody h3 { font: 700 1.2rem/1.15 var(--font-display); margin: 3px 0 0; text-wrap: balance; }
.gbody p {
  grid-column: 1 / -1; margin: 9px 0 0; font-size: 0.92rem; color: var(--muted);
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
.gfoot { margin-top: auto; padding: 12px 14px 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.gcost { font: 500 0.75rem/1.3 var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.gcost b { font: 800 1.05rem/1 var(--font-display); color: var(--fg); }
.gbuild {                                        /* an action: in colour */
  font: 700 var(--step--1)/1 var(--font-body); color: var(--accent); background: none; cursor: pointer;
  border: 1.5px solid var(--accent); border-radius: var(--radius); padding: 7px 10px; display: inline-flex; gap: 6px; align-items: center;
}
.gbuild:hover { background: var(--accent); color: var(--accent-ink); }
.gcard.here { border-color: var(--pc, var(--fg)); box-shadow: 0 0 0 2px var(--pc, var(--fg)); }
.gcard.here .gmeta::after { content: " · " attr(data-now); color: var(--fg); }
.gbuild::before { content: ""; width: 7px; height: 7px; background: currentColor; transform: rotate(45deg); }

/* the workshop space as the hub the later workshops are made from */
.gal-hub {
  display: grid; grid-template-columns: minmax(0, 250px) minmax(0, 1fr); gap: 16px 24px;

/* split: words on the left, pictures on the right */

/* steps: the timeline, numbered phases side by side */
.psteps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(14px, 2.4vw, 36px); align-content: start; }

/* popup: a concept window opening over the model; × puts it away to show the model behind */
.ppop { grid-area: main; display: grid; place-items: center; padding: 20px; background: rgb(10 14 12 / .38); transition: background .4s; }
.ppop-win {
  width: min(1100px, 100%); max-height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden;
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 18px 60px rgb(0 0 0 / .35);

.ppop-body figure { margin: 0; min-height: 0; }

.ppop-text { padding: clamp(14px, 2vw, 28px); display: grid; align-content: start; gap: 10px; min-width: 0; }

.ppop.shut { background: transparent; pointer-events: none; }
.ppop.shut .ppop-win { animation: ppop-out .3s ease both; }
@keyframes ppop-out { to { opacity: 0; transform: translateY(18px) scale(.94); visibility: hidden; } }
/* walk mode: a hint along the bottom, arrows on touch screens */
.fpv-hint {
  position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); max-width: calc(100% - 32px); z-index: 3;
  background: rgb(20 24 22 / .72); color: #f5f6f2; border-radius: 999px; padding: 7px 14px;
  font: 500 var(--step--1)/1.3 var(--font-mono); text-align: center; pointer-events: none;
}
.fpv-pad {
  position: absolute; right: 14px; bottom: 54px; z-index: 3; display: grid; gap: 6px;
  grid-template-columns: repeat(3, 48px); grid-template-rows: repeat(2, 48px); grid-template-areas: ". w ." "a s d";
}

  border-radius: 10px; border: 1px solid var(--line); background: rgb(245 246 242 / .85); color: #1c2320;

}
.fpv-pad [data-k="KeyW"] { grid-area: w; } .fpv-pad [data-k="KeyA"] { grid-area: a; }
.fpv-pad [data-k="KeyS"] { grid-area: s; } .fpv-pad [data-k="KeyD"] { grid-area: d; }
.stage.fpv canvas { cursor: grab; }
.stage.fpv.looking canvas { cursor: grabbing; }
.pcap.passing { animation: pcap-pass 1s ease 7s forwards; }   /* the walk: say where we are, then clear the view */
@keyframes pcap-pass { to { opacity: 0; transform: translateY(8px); visibility: hidden; } }
.pcap.ptitle { align-self: center; padding: 26px 32px 28px; max-width: min(44rem, calc(100% - 32px)); }
.pcap.ptitle h2 { font-size: clamp(2.4rem, 5.2vw, 4.8rem); line-height: 1.05; }
.pmedia {
  grid-area: main; background: var(--bg); min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 18px;
  padding: clamp(16px, 3vw, 40px) clamp(16px, 3vw, 40px) 16px;
}
.pm-head { display: grid; gap: 6px; border-bottom: 2px solid var(--fg); padding-bottom: 12px; }
.pm-head h2 { margin: 0; font: 800 clamp(1.8rem, 3.6vw, 3.2rem)/1.1 var(--font-display); text-wrap: balance; }
.pm-head p { margin: 0; font-size: clamp(1rem, 1.35vw, 1.3rem); max-width: 60ch; color: var(--muted); }
.pm-grid { display: grid; gap: 14px; min-height: 0; grid-template-columns: minmax(0, 1fr); }
.pm-grid.n2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.pm-grid.n3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.pm-grid.n4 { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); }
/* lead: the first picture large (a drawing), the others stacked beside it */
.pm-grid.lead { grid-template-columns: minmax(0, 2.3fr) minmax(0, 1fr); grid-auto-rows: minmax(0, 1fr); }
.pm-grid.lead figure:first-child { grid-row: 1 / span 3; }

/* mosaic: a photo essay filling the slide, 6 columns x 2 rows; a 'wide' photo takes two columns; captions on the photo */

  position: absolute; left: 8px; bottom: 8px; max-width: calc(100% - 16px); padding: 3px 7px; border-radius: 2px;
  background: rgb(20 24 22 / .72); color: #f5f6f2; pointer-events: none;
}
.pm-grid img { cursor: zoom-in; }
.pmedia { position: relative; }
.pm-zoom {                                       /* a picture opened full size; a click closes it */
  position: absolute; inset: 0; z-index: 2; background: var(--bg); padding: 12px; display: grid; cursor: zoom-out;
}
.pm-zoom img { width: 100%; height: 100%; min-height: 0; object-fit: contain; }

.pbar {

  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 18px; align-items: center;
  padding: 6px 16px calc(6px + env(safe-area-inset-bottom, 0px));

.psecs button:hover { color: var(--fg); }

.pctl { display: flex; align-items: center; gap: 8px; }

.pclock { background: none; border: 0; padding: 4px; cursor: pointer; }

@media (max-width: 860px) {

// ------------------------------------------------------------------ data
const [cfg, manifest, cfgHu, presCfg] = await Promise.all([

  fetch('model/manifest.json').then(r => r.json()),
  fetch('phases.hu.json').then(r => r.ok ? r.json() : null).catch(() => null),
  fetch('presentation.json').then(r => r.ok ? r.json() : null).catch(() => null),
]);
const phases = cfg.phases;
const N = phases.length - 1;
const TN = phases[N].kind === 'sandbox' ? N - 1 : N;   // the timeline's last stop: your yard has a tab of its own
// one accent colour for every workshop (the page's own --accent, so it follows the theme); the 3D view takes its value
const phaseCol = () => 'var(--accent)';
const ACCENT_3D = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#2d5a74';

// The Hungarian texts are laid over the English ones in place (the English kept aside), so everything that reads

// strings or pairs (build, materials) are swapped whole.
const enKept = {};
function overlay(target, src, kept, hu) {
  if (!target || !src) return;
  for (const k of Object.keys(src)) {
    if (k.startsWith('_')) continue;
    const v = src[k];
    const objList = Array.isArray(v) && v.length && v[0] && typeof v[0] === 'object' && !Array.isArray(v[0]);
    if (v && typeof v === 'object' && !Array.isArray(v) || objList) {
      kept[k] = kept[k] || (objList ? [] : {});

      else overlay(target[k], v, kept[k], hu);
    } else {
      if (!(k in kept)) kept[k] = target[k];
      target[k] = hu ? v : kept[k];
    }
  }

  for (const ph of phases) overlay(ph, (cfgHu.phases || {})[ph.id], enKept.phases[ph.id] = enKept.phases[ph.id] || {}, hu);

// yard frame: s along the pavilion facade (north end = 0, street +), n west of the facade
const F = manifest.frame, O = manifest.origin_world;
function snTo3(s, n, y = 0) {
  const a = F.L - s;
  const x = F.C[0] + a * F.U[0] - n * F.V[0];
  const yw = F.C[1] + a * F.U[1] - n * F.V[1];
  return new THREE.Vector3(x - O[0], y, -(yw - O[1]));
}
const sDir = snTo3(1, 0).sub(snTo3(0, 0)).normalize();   // towards the street
const nDir = snTo3(0, 1).sub(snTo3(0, 0)).normalize();   // towards the west wall

// ------------------------------------------------------------------ renderer
const stage = $('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;

renderer.toneMappingExposure = 1.05;
stage.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.3, 2500);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.49;
controls.minDistance = 4;
controls.maxDistance = 400;

// Daylight: the yard is a deep well between 19-28 m walls, so the sun only reaches its floor when it is high and
// shines along the yard's long axis, from the street end (bearing ~160 deg): a late morning in June, ~11:20, the sun
// ~63 deg up. A stage with "light": "dusk" in phases.json (the film night) fades to evening instead.
const hemi = new THREE.HemisphereLight(0xeef3ff, 0x5a5448, 0.9);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1dc, 2.4);
const SUN_EL = THREE.MathUtils.degToRad(63);
sun.position.copy(sDir.clone().multiplyScalar(Math.cos(SUN_EL)).setY(Math.sin(SUN_EL)).multiplyScalar(120));
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -45, right: 45, top: 45, bottom: -45, near: 10, far: 200 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

const groundMat = new THREE.MeshStandardMaterial({ roughness: 1 });
const ground = new THREE.Mesh(new THREE.CircleGeometry(900, 64), groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.30;                       // below every street surface (carriageway at -0.12, kerbs to -0.25)
ground.receiveShadow = true;
scene.add(ground);

const themeSky = new THREE.Color();
let lastDusk = -1;                               // the day/dusk mix last applied (applyLight below)
function applyTheme() {
  const cs = getComputedStyle(document.documentElement);
  themeSky.set(cs.getPropertyValue('--sky').trim());
  scene.background = themeSky.clone();
  scene.fog = new THREE.Fog(themeSky.clone(), 140, 520);
  groundMat.color.set(cs.getPropertyValue('--ground').trim());
  lastDusk = -1;                                 // re-apply the light mix on the next frame
}
// day <-> dusk: d = 0 full daylight, 1 the film night (sun gone, a dim blue evening)
const DUSK_SKY = new THREE.Color(0x283250), DAY_HEMI = new THREE.Color(0xeef3ff), DUSK_HEMI = new THREE.Color(0x8d9fd0);
function applyLight(d) {
  if (Math.abs(d - lastDusk) < 0.002) return;
  lastDusk = d;
  sun.intensity = 2.4 * (1 - d);
  sun.castShadow = d < 0.95;
  hemi.intensity = 0.9 - 0.4 * d;
  hemi.color.copy(DAY_HEMI).lerp(DUSK_HEMI, d);
  renderer.toneMappingExposure = 1.05 - 0.15 * d;
  scene.background.copy(themeSky).lerp(DUSK_SKY, d);
  scene.fog.color.copy(scene.background);
  // the machinery house lit from inside: its glass turns opaque and glows warm, so the rooms behind don't show
  for (const m of litGlass) {
    const u = m.userData, b = u.base, mat = m.material;
    if (u.opacity0 === undefined) { u.opacity0 = b.opacity; u.color0 = mat.color.clone(); }   // the daytime glass
    b.opacity = u.opacity0 + (1 - u.opacity0) * d;
    b.transparent = b.opacity < 0.999; b.depthWrite = !b.transparent;

async function fetchWithProgress(url, total) {
  const res = await fetch(url);
  if (!res.body || !res.body.getReader) return new Uint8Array(await res.arrayBuffer());
  const reader = res.body.getReader();
  const chunks = [];
  let got = 0;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value); got += value.length;
    $('loadBar').style.width = Math.min(100, 100 * got / total).toFixed(1) + '%';
    $('loadText').textContent = tx('loadingMB', (got / 1e6).toFixed(1), (total / 1e6).toFixed(1));
  }
  const buf = new Uint8Array(got);
  let o = 0;
  for (const c of chunks) { buf.set(c, o); o += c.length; }
  return buf;
}
const b64 = new TextDecoder().decode(await fetchWithProgress('model/geometry.b64.txt', manifest.b64_bytes));

for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);

// ------------------------------------------------------------------ W4 posters
// The residents' posters, drawn here (the Rhino model only carries their size, place and design number, see
// scripts/build_w4_window_posters.py DESIGNS): the workshops' own words in Hungarian, a simple motif each.
function posterTexture(design, aspect) {
  const D = [
    { word: 'MOZI',      sub: 'filmest az udvaron',  bg: '#1f3566', fg: '#f3c64a', motif: 'film' },    // cinema
    { word: 'TŰZ',       sub: 'tűzkör · mesék',      bg: '#c8402f', fg: '#f6ead2', motif: 'flame' },   // fire
    { word: 'KERT',      sub: 'gurul a kert',        bg: '#3c8250', fg: '#f6ead2', motif: 'leaf' },    // garden
    { word: 'MŰHELY',    sub: 'kézzel, együtt',      bg: '#ebbe32', fg: '#2a2622', motif: 'tools' },   // workshop
    { word: 'LEVES',     sub: 'bográcsban, mindenkinek', bg: '#f0e4cd', fg: '#c8402f', motif: 'bowl' },  // soup
    { word: 'UDVAR',     sub: 'Alföldi utca 6',      bg: '#28508f', fg: '#f3c64a', motif: 'plan' },    // courtyard
    { word: 'EGYÜTT',    sub: 'ki mit tud',          bg: '#c8402f', fg: '#f6ead2', motif: 'ring' },    // together
    { word: 'ALFÖLDI 6', sub: 'udvar · 2026',        bg: '#ebbe32', fg: '#2a2622', motif: 'six' },
    { word: 'NYITVA',    sub: 'gyere be',            bg: '#3c8250', fg: '#f6ead2', motif: 'sun' },     // open
  ];
  const d = D[design % D.length], W = 256, H = Math.round(W / aspect);
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  const draw = () => {
    x.fillStyle = d.bg; x.fillRect(0, 0, W, H);
    x.fillStyle = d.fg; x.strokeStyle = d.fg; x.lineWidth = 10; x.lineCap = 'round';
    const cx = W / 2, cy = H * 0.42, r = W * 0.3;
    if (d.motif === 'film') {
      x.beginPath(); x.arc(cx, cy + r * 0.2, r * 0.55, Math.PI, 0); x.fill();
      x.fillRect(0, cy + r * 0.2, W, 6);
      for (let i = 0; i < 8; i++) x.fillRect(i * 34 + 6, 14, 20, 14);
    } else if (d.motif === 'flame') {
      [[0, 1.0, d.fg], [-0.35, 0.65, '#f3c64a'], [0.35, 0.7, '#f3c64a']].forEach(([dx, k, col]) => {
        x.fillStyle = col; x.beginPath(); x.moveTo(cx + dx * r - r * 0.35 * k, cy + r * 0.7);
        x.quadraticCurveTo(cx + dx * r, cy - r * 1.1 * k, cx + dx * r + r * 0.35 * k, cy + r * 0.7); x.fill(); });
    } else if (d.motif === 'leaf') {
      for (const a of [-0.6, 0, 0.6]) { x.save(); x.translate(cx, cy + r * 0.6); x.rotate(a); x.beginPath();
        x.ellipse(0, -r * 0.6, r * 0.28, r * 0.6, 0, 0, Math.PI * 2); x.fill(); x.restore(); }
    } else if (d.motif === 'tools') {
      x.save(); x.translate(cx, cy); x.rotate(0.6); x.fillRect(-8, -r, 16, r * 2); x.fillRect(-r * 0.4, -r, r * 0.8, 26); x.restore();
      x.save(); x.translate(cx, cy); x.rotate(-0.6); x.fillRect(-8, -r, 16, r * 2); x.fillRect(-14, r * 0.3, 28, r * 0.7); x.restore();
    } else if (d.motif === 'bowl') {
      x.beginPath(); x.arc(cx, cy, r * 0.8, 0, Math.PI); x.fill();
      for (const dx of [-0.35, 0, 0.35]) { x.beginPath(); x.moveTo(cx + dx * r, cy - 12);
        x.bezierCurveTo(cx + dx * r - 18, cy - r * 0.4, cx + dx * r + 18, cy - r * 0.6, cx + dx * r, cy - r); x.stroke(); }
    } else if (d.motif === 'plan') {
      for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) if (i !== 1 || j !== 1) x.fillRect(cx - r + i * r * 0.72, cy - r + j * r * 0.72, r * 0.56, r * 0.56);
      x.beginPath(); x.arc(cx, cy, r * 0.2, 0, Math.PI * 2); x.fill();
    } else if (d.motif === 'ring') {
      for (let i = 0; i < 9; i++) { const a = i / 9 * Math.PI * 2; x.beginPath(); x.arc(cx + Math.cos(a) * r * 0.8, cy + Math.sin(a) * r * 0.8, r * 0.16, 0, Math.PI * 2); x.fill(); }
    } else if (d.motif === 'six') {
      x.font = `800 ${Math.round(r * 2.4)}px "Atkinson Hyperlegible Next", "Segoe UI", sans-serif`; x.textAlign = 'center'; x.textBaseline = 'middle';
      x.fillText('6', cx, cy + r * 0.1);
    } else if (d.motif === 'sun') {
      x.beginPath(); x.arc(cx, cy, r * 0.45, 0, Math.PI * 2); x.fill();
      for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; x.beginPath(); x.moveTo(cx + Math.cos(a) * r * 0.62, cy + Math.sin(a) * r * 0.62);
        x.lineTo(cx + Math.cos(a) * r * 0.95, cy + Math.sin(a) * r * 0.95); x.stroke(); }
    }
    x.fillStyle = d.fg; x.textAlign = 'center'; x.textBaseline = 'alphabetic';
    let size = 78; x.font = `800 ${size}px "Atkinson Hyperlegible Next", "Segoe UI", sans-serif`;
    while (x.measureText(d.word).width > W * 0.86 && size > 20) { size -= 4; x.font = `800 ${size}px "Atkinson Hyperlegible Next", "Segoe UI", sans-serif`; }
    x.fillText(d.word, cx, H * 0.86);
    x.font = '600 15px "Atkinson Hyperlegible Mono", monospace'; x.fillText(d.sub, cx, H * 0.95);
  };
  draw();
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  if (document.fonts) document.fonts.ready.then(() => { draw(); tex.needsUpdate = true; });   // redraw in the page's fonts
  return tex;
}
// a poster mesh from the model: planar texture coordinates along the facade (s) and up, the design as its map
function dressPoster(mesh, design) {
  const pos = mesh.geometry.attributes.position, v = new THREE.Vector3();
  let u0 = Infinity, u1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (let i = 0; i < pos.count; i++) { v.fromBufferAttribute(pos, i); const u = v.dot(sDir); u0 = Math.min(u0, u); u1 = Math.max(u1, u); y0 = Math.min(y0, v.y); y1 = Math.max(y1, v.y); }
  const uv = new Float32Array(pos.count * 2);
  for (let i = 0; i < pos.count; i++) { v.fromBufferAttribute(pos, i); uv[2 * i] = (v.dot(sDir) - u0) / (u1 - u0); uv[2 * i + 1] = (v.y - y0) / (y1 - y0); }
  mesh.geometry.setAttribute('uv', new THREE.BufferAttribute(uv, 2));   // seen from the yard (-n), +s is to the right
  mesh.material.map = posterTexture(design, (u1 - u0) / (y1 - y0));
  mesh.material.color.set(0xffffff);
  mesh.material.needsUpdate = true;
}

const FLAT = /^02_Courtyard_Ground(::(Asphalt_Yard|Concrete_Apron|Garden_Bed_Mulch|Walkway_Concrete_Slabs|Brick_Curb_Edging|Stepping_Slabs))?$|^05_Street::(Road_Markings|Sidewalks|Parking_Setts|Plaza_Paving|Planting_Beds|Nepszinhaz_Junction|Carriageway_Asphalt|Kerbs_Granite)$/;
const OVERHEAD = /Tree_Crowns|Corrugated_Roofs|Polycarbonate_Roof|WC_Entrance_Canopy/;
const xrayCandidates = [];
// carriageway, junction and parking setts are coplanar at -0.12 m, markings 5 mm above, plaza and pavements share 0.0
const SURFACE_PRIORITY = { Road_Markings: 4, Parking_Setts: 3, Nepszinhaz_Junction: 2, Plaza_Paving: 1 };
const groups = {};            // viewer group -> [mesh]
const zoneMeshes = {};        // zone id -> [mesh]
const proposed = [];          // { mesh, phaseIndex }: new elements, grow in at their workshop
const removedParts = [];      // { mesh, phaseIndex }: existing elements a workshop takes away

const phaseMeshes = {};       // phase id -> its proposed + removed meshes (part of that stage's subject)
for (const p of manifest.parts) {
  if (p.piece && p.piece.startsWith('poster:')) continue;   // W4: the concept's window pattern (below) replaces the posters
  const [po, pn] = p.position, [no, nn] = p.normal, [io, inn] = p.index;
  const q = new Int16Array(bin, po, pn);

  const g = new THREE.BufferGeometry();

  const nrm = new Int8Array(bin, no, nn);
  let hasN = false;
  for (let i = 0; i < Math.min(nn, 30); i++) if (nrm[i] !== 0) { hasN = true; break; }
  if (hasN) g.setAttribute('normal', new THREE.BufferAttribute(new Int8Array(nrm), 3, true));
  const idx = p.itype === 'H' ? new Uint16Array(bin, io, inn) : new Uint32Array(bin, io, inn);
  g.setIndex(new THREE.BufferAttribute(idx.slice(), 1));

  const c = p.material.color, op = p.material.opacity;
  const mat = new THREE.MeshStandardMaterial({
    color: new THREE.Color(`rgb(${c[0]},${c[1]},${c[2]})`),

    metalness: /Galvanised|Aluminium|Zinc/.test(p.material.name) ? 0.35 : 0.0,
    transparent: op < 0.999, opacity: Math.max(op, 0.18), depthWrite: op >= 0.999,
    side: THREE.DoubleSide,
  });

  const prio = SURFACE_PRIORITY[p.layer.split('::').pop()];
  if (prio && p.layer.startsWith('05_Street')) {
    mat.polygonOffset = true;
    mat.polygonOffsetFactor = -prio;

  }
  if (/white screen/.test(p.material.name)) {         // the painted cinema wall: keep it reading as a screen in shade
    mat.emissive = new THREE.Color(0xffffff);

  }
  const mesh = new THREE.Mesh(g, mat);
  if (/Pavilion::Glazing/.test(p.layer)) litGlass.push(mesh);   // lit from inside at dusk (applyLight)
  if (p.piece && p.piece.startsWith('lit:')) litGlass.push(mesh);   // a lit window in the buildings round the yard
  if (/::Festoon_Bulbs$/.test(p.layer)) {             // bulb strings: faintly warm by day, glowing at dusk (applyLight)
    mat.emissive = new THREE.Color(0xffc56e); mat.emissiveIntensity = BULB_DAY; bulbs.push(mesh);

  if (!FLAT.test(p.layer)) { g.computeBoundsTree(); xrayCandidates.push(mesh); }

  (groups[p.group] ||= []).push(mesh);
  if (p.zone) (zoneMeshes[p.zone] ||= []).push(mesh);
  if (p.phase) proposed.push({ mesh, phaseIndex: phases.findIndex(ph => ph.id === p.phase) });
  if (p.removed) removedParts.push({ mesh, phaseIndex: phases.findIndex(ph => ph.id === p.removed) });
  if (p.phase || p.removed) (phaseMeshes[p.phase || p.removed] ||= []).push(mesh);
  if (p.until) {                                    // packed away again by a later workshop
    storedParts.push({ mesh, phaseIndex: phases.findIndex(ph => ph.id === p.until) });
    (phaseMeshes[p.until] ||= []).push(mesh);
  }
  if (p.away) {                                     // moved elsewhere for one workshop only, back after it
    awayParts.push({ mesh, phaseIndex: phases.findIndex(ph => ph.id === p.away) });
    (phaseMeshes[p.away] ||= []).push(mesh);
  }
}

// ------------------------------------------------------------------ W4 window pattern
// The poster workshop's concept (presentation/concept_posters.jpg, the team's visualisation, 2026-10): its yellow
// pattern taken off the photo and rectified onto the facade (a homography fitted to the mullions and the door), with
// the columns the photo can't show (behind the trunks, the glazed door, past the frame) filled by mirrored
// neighbours. presentation/concept_pattern.png spans s 0..18.5 m, y 0.05..3.35 m of the yard side. Each yard-side
// pane of the machinery house gets its cut-out, pasted on the glass: one mesh per pane, so the workshop's sequence
// (layer ::Concept_Pattern in phases.json) puts them up one after another from the north end.
const PATTERN = { s: [0, 18.5], y: [0.05, 3.35], src: 'presentation/concept_pattern.png' };
const patternImg = new Image();
const patternReady = new Promise(r => { patternImg.onload = r; patternImg.onerror = r; });
patternImg.src = PATTERN.src;
const patternTex = new THREE.Texture(patternImg);
patternReady.then(() => { patternTex.needsUpdate = true; });
patternTex.colorSpace = THREE.SRGBColorSpace;
patternTex.anisotropy = 8;
const patternMat = new THREE.MeshStandardMaterial({ map: patternTex, transparent: true, alphaTest: 0.45, side: THREE.DoubleSide,
  roughness: 0.75, emissive: 0xf7d41f, emissiveMap: patternTex, emissiveIntensity: 0.32 });   // the concept's bright yellow, in shade too
{
  const glass = partMeshes.find(m => m.userData.layer === 'ADDITIONS::Pavilion::Glazing');
  const w4 = phases.findIndex(ph => ph.id === 'w4');
  const panes = {};                              // the yard-side panes, from the glazing's triangles facing the yard
  if (glass && w4 >= 0) {
    const pos = glass.geometry.attributes.position, idx = glass.geometry.index.array, v = new THREE.Vector3();
    const tri = [new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3()], nrm = new THREE.Vector3();
    for (let t = 0; t < idx.length; t += 3) {
      tri.forEach((q, k) => q.fromBufferAttribute(pos, idx[t + k]));
      nrm.subVectors(tri[1], tri[0]).cross(v.subVectors(tri[2], tri[0])).normalize();
      if (Math.abs(nrm.dot(nDir)) < 0.9) continue;                                  // pane faces only
      const sn = tri.map(q => { const d = q.clone().sub(snTo3(0, 0)); return [d.dot(sDir), d.dot(nDir)]; });
      if (sn.some(([, n]) => n < -0.12)) continue;                                  // the yard side only
      const s0 = Math.min(...sn.map(x => x[0])), s1 = Math.max(...sn.map(x => x[0]));
      const y0 = Math.min(...tri.map(q => q.y)), y1 = Math.max(...tri.map(q => q.y));
      const key = [s0, s1, y0, y1].map(x => x.toFixed(1)).join();
      const r = panes[key] || (panes[key] = [Infinity, -Infinity, Infinity, -Infinity]);
      r[0] = Math.min(r[0], s0); r[1] = Math.max(r[1], s1); r[2] = Math.min(r[2], y0); r[3] = Math.max(r[3], y1);
    }
  }
  Object.values(panes).forEach(([s0, s1, y0, y1], i) => {
    if (s1 - s0 < 0.3 || y1 - y0 < 0.3) return;
    const N = -0.03;                             // 10 mm proud of the glass, on the yard side
    const corners = [[s0, y0], [s1, y0], [s1, y1], [s0, y1]];
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(corners.flatMap(([s, y]) => snTo3(s, N, y).toArray()), 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(corners.flatMap(([s, y]) =>
      [(s - PATTERN.s[0]) / (PATTERN.s[1] - PATTERN.s[0]), (y - PATTERN.y[0]) / (PATTERN.y[1] - PATTERN.y[0])]), 2));
    g.setIndex([0, 1, 2, 0, 2, 3]);
    g.computeVertexNormals();
    const mesh = new THREE.Mesh(g, patternMat);
    mesh.receiveShadow = true;
    mesh.userData = { layer: '09_Workshops::w4_window_posters::Concept_Pattern', phase: 'w4', piece: 'pane ' + i,
      base: { opacity: 1, transparent: true, depthWrite: true, cast: false }, fade: 0, fadeGoal: 0 };
    scene.add(mesh);
    partMeshes.push(mesh);

}
// a piece of the pattern on a sheet of paper, for the work tables: the shapes drawn in pencil, coloured in yellow up to
// 'fill' (0..1, from the left); cut = only the yellow cut-out, on nothing (one being carried to the windows)
function patternSheet(crop, fill = 1, cut = false) {
  const [s0, s1, y0, y1] = crop, PPM = 160;
  const W = Math.round((s1 - s0) * PPM), H = Math.round((y1 - y0) * PPM);
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  patternReady.then(() => {
    const x = c.getContext('2d'), iw = patternImg.width, ih = patternImg.height;
    const sx = (s0 - PATTERN.s[0]) / (PATTERN.s[1] - PATTERN.s[0]) * iw, sw = (s1 - s0) / (PATTERN.s[1] - PATTERN.s[0]) * iw;
    const sy = (PATTERN.y[1] - y1) / (PATTERN.y[1] - PATTERN.y[0]) * ih, sh = (y1 - y0) / (PATTERN.y[1] - PATTERN.y[0]) * ih;
    const shapes = (tint) => {                   // the crop, recoloured
      const t = document.createElement('canvas'); t.width = W; t.height = H; const q = t.getContext('2d');
      q.drawImage(patternImg, sx, sy, sw, sh, 0, 0, W, H);
      if (tint) { q.globalCompositeOperation = 'source-in'; q.fillStyle = tint; q.fillRect(0, 0, W, H); }
      return t;
    };
    if (!cut) {
      x.fillStyle = '#f1ece0'; x.fillRect(0, 0, W, H);
      const pencil = shapes('#55524c'), paper = shapes('#f1ece0');
      for (const [dx, dy] of [[-2, 0], [2, 0], [0, -2], [0, 2]]) x.drawImage(pencil, dx, dy);
      x.drawImage(paper, 0, 0);
      x.save(); x.beginPath(); x.rect(0, 0, W * fill, H); x.clip(); x.drawImage(shapes(null), 0, 0); x.restore();
    } else x.drawImage(shapes(null), 0, 0);
    tex.needsUpdate = true;
  });
  return tex;
}

// A view is { az, el, dist } in the yard frame: az 0 = camera on the street side looking north,

// ------------------------------------------------------------------ x-ray
// On a workshop stage, whatever stands between the camera and that zone's floor (a tree crown, a roof,
// or a wall once the viewer orbits) fades out, so the zone itself always stays visible.
const rcX = new THREE.Raycaster();
const camLast = new THREE.Vector3(Infinity, 0, 0);
let xrayKey = '', xrayAt = 0;
function zoneSamples(z) {
  if (z.samples) return z.samples;

  const k = z.areas.length > 1 ? 4 : 5;
  for (const { rect: r, centre } of z.areas) {
    for (let i = 0; i < k; i++) for (let j = 0; j < k; j++)
      pts.push(snTo3(r.s[0] + (i + .5) / k * (r.s[1] - r.s[0]), r.n[0] + (j + .5) / k * (r.n[1] - r.n[0]), 0.4));
    pts.push(centre.clone().setY(1.2));

}
function updateXray(now) {
  if (walk || fpv) {                             // the POV walk and walk mode clear their own view
    if (now - xrayAt > 0.08) { xrayAt = now; xrayKey = ''; walkXray(); }
    return;
  }
  const ph = phases[Math.round(t)];
  const moved = camera.position.distanceToSquared(camLast) > 0.0025;
  const key = ph.id + (xrayZone || '') + (canopyTo ?? '');
  if (key === xrayKey && !(moved && now - xrayAt > 0.08)) return;
  xrayKey = key; xrayAt = now; camLast.copy(camera.position);
  if (canopyTo != null) {                        // the opening and closing shots: every crown see-through, nothing else
    for (const m of xrayCandidates) m.userData.fadeGoal = CROWNS.test(m.userData.layer) ? 1 : 0;
    return;
  }
  // at a midway stop the camera tours work spots that can lie outside the zone (e.g. under the street-end trees):
  // also keep the line of sight to what the camera is looking at clear
  const k = Math.round(t), atMid = phases[k].midway && Math.abs(t - (k - 0.5)) < 0.4;
  const extra = [];
  if (atMid) for (const [dx, dz] of [[0, 0], [1.5, 0], [-1.5, 0], [0, 1.5], [0, -1.5]])
    for (const y of [0.4, 1.4]) extra.push(controls.target.clone().add(new THREE.Vector3(dx, 0, dz)).setY(y));
  xrayFor(xrayZone ? zones[xrayZone] : ph.zone ? zones[ph.zone] : null, extra);
}
function xrayFor(z, extra = []) {
  for (const m of xrayCandidates) m.userData.fadeGoal = 0;
  if (!z) return;
  const own = new Set([...(zoneMeshes[z.id] || []), ...(phaseMeshes[phases[z.phaseIndex].id] || [])]);
  const cands = xrayCandidates.filter(m => m.visible && !own.has(m));
  // roofs and crowns directly over the zone always go: rays from a low camera can slip under an open-fronted
  // lean-to and miss it, yet it still hides most of the floor
  const pts = extra.length ? zoneSamples(z).concat(extra) : zoneSamples(z);
  for (const m of xrayCandidates) {                       // includes the zone's own roofs
    if (!m.visible || !OVERHEAD.test(m.userData.layer)) continue;
    const bb = m.geometry.boundingBox || (m.geometry.computeBoundingBox(), m.geometry.boundingBox);
    if (bb.max.y > 1.8 && pts.some(p => p.x >= bb.min.x && p.x <= bb.max.x && p.z >= bb.min.z && p.z <= bb.max.z)) m.userData.fadeGoal = 1;
  }
  const dir = new THREE.Vector3();
  for (const p of pts) {
    dir.subVectors(p, camera.position);
    const d = dir.length();
    rcX.set(camera.position, dir.divideScalar(d));
    rcX.far = d - 0.3;

function animateFades(dt) {

  for (const m of xrayCandidates) {
    const u = m.userData;
    if (u.fade === u.fadeGoal) continue;
    u.fade += (u.fadeGoal - u.fade) * k;
    if (Math.abs(u.fadeGoal - u.fade) < 0.01) u.fade = u.fadeGoal;
    const mat = m.material, b = u.base, faded = u.fade > 0;
    const lo = canopyTo != null && CROWNS.test(u.layer) ? canopyTo : 0.12;   // see-through crowns stay visible
    mat.opacity = b.opacity + (Math.min(b.opacity, lo) - b.opacity) * u.fade;
    if (mat.transparent !== (faded || b.transparent)) { mat.transparent = faded || b.transparent; mat.needsUpdate = true; }
    mat.depthWrite = faded ? false : b.depthWrite;

// ------------------------------------------------------------------ per-frame state
const clock = new THREE.Clock();
const tmp = new THREE.Vector3();
function updateScene(time) {
  for (const [m, v, sy] of setoutTouched) { m.visible = v; m.scale.y = sy; }
  setoutTouched = [];
  const active = Math.round(t);
  for (const [zid, z] of Object.entries(zones)) {
    const k = z.phaseIndex;
    const done = THREE.MathUtils.clamp(t - k + 1, 0, 1);         // 0 before, 1 once this workshop is reached
    const isActive = active === k;
    const pulse = isActive && !reduceMotion ? 0.5 + 0.5 * Math.sin(time * 3) : 0.5;
    // colour only on the stage in hand; the other workshops' areas stay a quiet grey
    z.padMat.color.copy(isActive ? z.color : ZONE_GREY);
    z.outlineMat.color.copy(isActive ? z.color : ZONE_GREY);
    z.padMat.opacity = done * (isActive ? 0.30 + 0.12 * pulse : 0.12);
    z.outlineMat.opacity = isActive ? 1 : done > 0.99 ? 0.55 : 0.3;
    z.outlineMat.dashSize = done > 0.99 ? 100 : 0.45;
    const atMidway = Math.abs(t - (k - 0.5)) < 0.4 && phases[k].midway;   // people are the subject there, not the glow
    for (const m of zoneMeshes[zid] || []) m.material.emissiveIntensity = isActive ? (atMidway ? 0.05 : 0.25 + 0.25 * pulse) : 0;
  }
  for (const p of proposed) {
    if (seqMeshes.has(p.mesh)) continue;
    const s = THREE.MathUtils.clamp(t - p.phaseIndex + 1, 0, 1);
    p.mesh.visible = s > 0.001;
    p.mesh.scale.set(1, Math.max(s, 0.001), 1);
  }
  for (const p of removedParts) {                                   // sink into the ground as the workshop arrives
    if (seqMeshes.has(p.mesh)) continue;
    const s = 1 - THREE.MathUtils.clamp(t - p.phaseIndex + 1, 0, 1);
    p.mesh.visible = s > 0.001;
    p.mesh.scale.set(1, Math.max(s, 0.001), 1);
  }
  for (const q of sequenced) {                                      // built / taken down step by step
    const loc = THREE.MathUtils.clamp((t - (q.k - 1) - q.a) / (q.b - q.a), 0, 1);
    if (q.stored && t <= q.k - 1 + q.a) continue;                   // before its packing window: its own workshop decides
    if (q.away && t >= q.k) continue;                               // borrowed pieces come back after the stage (below)
    const f = q.build ? loc : 1 - loc;
    if (q.whole) { q.mesh.visible = f >= 0.5; continue; }
    if (q.sweep) {
      const [lo, hi] = sweeps[q.sweep];
      q.mesh.visible = f > 0.001 && q.d <= lo + f * (hi - lo) + 1e-3;
      continue;
    }
    q.mesh.visible = f > 0.001;
    q.plane.constant = f >= 0.999 ? q.max + 1 : q.min + f * (q.max - q.min);
  }
  for (const p of storedParts) {                                    // packed away: sink like a removed element
    if (seqStored.has(p.mesh)) continue;                            // ... unless a midway sequence packs it
    const s = 1 - THREE.MathUtils.clamp(t - p.phaseIndex + 1, 0, 1);
    if (s >= 0.999) { if (seqMeshes.has(p.mesh)) p.mesh.scale.y = 1; continue; }   // sequenced meshes don't rescale
    p.mesh.visible = p.mesh.visible && s > 0.001;
    p.mesh.scale.set(1, Math.max(s, 0.001), 1);
  }
  for (const p of awayParts) {                                      // borrowed for one stage: gone at it, back after
    const k = p.phaseIndex;
    if (t >= k) {
      const s = THREE.MathUtils.clamp(t - k, 0, 1);
      p.mesh.visible = s > 0.001; p.mesh.scale.y = Math.max(s, 0.001);
    } else if (t > k - 1 && !seqStored.has(p.mesh)) {               // no midway sequence takes them: sink instead
      const s = 1 - THREE.MathUtils.clamp(t - k + 1, 0, 1);
      p.mesh.visible = p.mesh.visible && s > 0.001; p.mesh.scale.y = Math.max(s, 0.001);
    } else if (p.mesh.scale.y !== 1 && seqMeshes.has(p.mesh)) p.mesh.scale.y = 1;
  }
  const soShow = new Map(), soHide = new Map();  // set out again near a stage (fully from halfway there)
  for (const so of setouts) {
    const w = THREE.MathUtils.clamp((1 - Math.abs(t - so.k)) * 2, 0, 1);
    if (w <= 0) continue;
    for (const m of so.show) soShow.set(m, Math.max(soShow.get(m) || 0, w));
    for (const m of so.hide) soHide.set(m, Math.max(soHide.get(m) || 0, w));
  }
  for (const [m, w] of soShow) {
    setoutTouched.push([m, m.visible, m.scale.y]);
    const s = Math.max(m.visible ? m.scale.y : 0, w);
    m.visible = s > 0.001; m.scale.y = Math.max(s, 0.001);
    if (m.material.clippingPlanes) for (const pl of m.material.clippingPlanes) pl.constant = 1e6;   // reset by its sequence next frame
  }
  for (const [m, w] of soHide) {
    setoutTouched.push([m, m.visible, m.scale.y]);
    const s = Math.min(m.visible ? m.scale.y : 0, 1 - w);
    m.visible = s > 0.001; m.scale.y = Math.max(s, 0.001);
  }
  for (const m of midways) {                                        // people at work around the midway stop
    const was = m.group.visible;
    m.group.visible = Math.abs(t - (m.k - 0.5)) < 0.4;
    if (m.group.visible && !was) workReset = true;                  // arriving at a midway: its scenes start over
    if (workReset) { workT0 = time - (workHold || 0); workReset = false; }
    // held on one tour view (the presentation): that view's scene runs on without the tour's loop
    if (m.group.visible) m.update(reduceMotion ? 1.0 : workHold != null ? time - workT0 : (time - workT0) % m.cycle);
  }
  // evening only right at a stage marked "light": "dusk" (the film night); its midway is daytime work
  let dusk = 0;
  phases.forEach((ph, k) => { if (ph.light === 'dusk' || (ph.night && yardNight)) dusk = Math.max(dusk, THREE.MathUtils.clamp(1 - Math.abs(t - k) * 2, 0, 1)); });
  applyLight(dusk);
  for (const m of scenes) {                                         // the finished space in use, at the stage itself
    m.group.visible = Math.abs(t - m.k) < 0.4;
    if (m.group.visible) m.update(reduceMotion ? 1.0 : time);
  }
  // slider visuals
  const f = Math.min(t, TN) / TN;
  $('fill').style.width = (f * 100) + '%';
  $('thumb').style.left = (f * 100) + '%';
  if (document.activeElement !== scrub || !scrub.matches(':active')) scrub.value = String(t);
}

// the stage strip in front of the white wall (kept clear in W6): a chair put there gets a guitarist
const STAGE = { s: [-7.4, -2.4], n: [11.6, 13.5] }, AUDIENCE = [-4.9, 9.0];
function isStageChair(u) {

function turnTowards(u, id) { turnToPoint(u, POIS[id].at()); }

}
$('yardRotate').addEventListener('click', (e) => { e.stopPropagation(); rotateSel(); });

  const b = e.target.closest('[data-yard], [data-face]');

  if (b.dataset.yard === 'rotate') rotateSel();

// the yard at night: the switch next to "All workshops" (only at this stage)
let yardNight = false;
const nightSpec = YARD_K >= 0 && phases[YARD_K].night;
const nightCrowd = nightSpec ? makeCrowd({ people: [], props: nightSpec.props || [], tour: [] }) : null;
const nightShow = partMeshes.filter(m => /^Cinema (projector tower|speaker)/.test(m.userData.piece || ''));   // film night: projector back out

// picking up and dragging
const rcY = new THREE.Raycaster(), ndcY = new THREE.Vector2(), GROUND = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
function aimAt(e) {

function pickUnit(e) {

}

}
stage.addEventListener('pointerdown', (e) => {
  if (!yardActive() || e.button > 0 || fpv) return;   // walking: a drag looks round instead
  if (e.target.closest && e.target.closest('button')) return;   // a button on the model (e.g. ↻) keeps the piece in hand
  const u = pickUnit(e), g = u && groundAt(e);
  if (!u || !g) { if (!u) setYardSel(null); return; }
  e.stopPropagation();                           // the camera stays put while a piece is carried
  e.preventDefault();

  stage.classList.add('grabbing');
}, true);
addEventListener('pointermove', (e) => {

});
addEventListener('pointerup', (e) => {

    if (isStageChair(yardDrag.u)) turnToPoint(yardDrag.u, snTo3(...AUDIENCE));   // on the stage: facing the audience
    use(yardDrag.u);

addEventListener('keydown', (e) => {

function yardUpdate(time, dt) {
  if (YARD_K < 0) return;
  const f = THREE.MathUtils.clamp(t - (YARD_K - 1), 0, 1);   // eases in from the opening
  for (const u of units) {
    const was = u.rot;
    if (u.rot !== u.rotGoal) {                   // turning eases round
      const dl = u.rotGoal - u.rot;
      u.rot = Math.abs(dl) < 0.002 || reduceMotion ? u.rotGoal : u.rot + dl * Math.min(1, dt * 7);
    }
    // spun round SICK_TURNS times without a break (hold R): whoever sits on it gets sick
    if (u.rot !== was) { u.spin = (u.spin || 0) + Math.abs(u.rot - was); u.spunAt = time; }
    else if (u.spin && time - u.spunAt > 6) u.spin = 0;
    if (u.spin >= SICK_TURNS * 2 * Math.PI) {
      u.spin = 0;
      for (const p of yardPeople) if (p.unit === u && p.slot && p.slot.seat != null && !p.target) throwUp(p, time);
    }
    const a = u.rot * f, c = Math.cos(a), s = Math.sin(a);
    const x = u.c.x + u.d.x * f - (u.c.x * c + u.c.z * s), z = u.c.z + u.d.z * f - (-u.c.x * s + u.c.z * c);
    const y = -dropOf(u) * f;
    for (const m of u.meshes) {
      m.rotation.y = a;
      m.position.set(x, y, z);
      if (f > 0 && m.material.clippingPlanes) for (const pl of m.material.clippingPlanes) pl.constant = 1e6;
    }
  }
  const on = yardActive();
  stage.classList.toggle('yard', on);
  const rb = $('yardRotate'), showRot = on && !!yardSel && !fpv;   // the turn button, while a piece is in hand
  if (rb.hidden === showRot) rb.hidden = !showRot;
  if (!on) { stage.classList.remove('can-grab'); yardHover = null; }
  const nb = $('nightToggle');
  if (nb.hidden === on) nb.hidden = !on;
  const night = yardNight && Math.abs(t - YARD_K) < 0.5;   // bulbs, fire, film; the light itself is set in updateScene
  if (nightCrowd) {
    nightCrowd.group.visible = night;
    if (night) nightCrowd.update(time);
  }
  if (night) for (const m of nightShow) {        // undone with the rest of the set-out at the start of the next frame
    m.visible = true; m.scale.y = 1;
    if (m.material.clippingPlanes) for (const pl of m.material.clippingPlanes) pl.constant = 1e6;
  }
  for (const m of unitMeshes) {                  // the piece in hand (or under the mouse) lights up
    const lit = on && (m.userData.unit === yardSel || m.userData.unit === yardHover) && m.material.emissive;
    if (lit) { m.material.emissive.copy(HL); m.material.emissiveIntensity = m.userData.unit === yardSel ? 0.55 : 0.3; m.userData.lit = true; }
    else if (m.userData.lit) { m.material.emissive.copy(m.userData.em0); m.material.emissiveIntensity = 0; m.userData.lit = false; }
  }
  yardGroup.visible = Math.abs(t - YARD_K) < 0.4;
  if (yardGroup.visible) { updatePeople(time, dt); updateSick(time); }
}

// ------------------------------------------------------------------ dizzy
// Spin a chair (or bench) with someone on it seven times round and they throw up: they double over, it comes out in an
// arc, and a puddle spreads on the asphalt in front of them (it dries up after a while, or on "Put everything back").
const SICK_TURNS = 7, SICK_FOR = 3.2, PUDDLE_FOR = 45;
const SICK_MAT = new THREE.MeshStandardMaterial({ color: 0x9aa437, roughness: 0.35 });
const sickEvents = [];
const GROUNDS = partMeshes.filter(m => /^02_Courtyard_Ground/.test(m.userData.layer || ''));
const headAt = new THREE.Vector3();
function throwUp(p, time) {
  p.sick = time;
  const drops = Array.from({ length: 18 }, () => { const m = new THREE.Mesh(new THREE.SphereGeometry(0.04, 6, 4), SICK_MAT); yardGroup.add(m); return m; });
  const puddle = new THREE.Mesh(new THREE.CircleGeometry(0.3, 18), SICK_MAT);
  puddle.rotation.x = -Math.PI / 2;
  puddle.scale.setScalar(0.001);
  yardGroup.add(puddle);
  sickEvents.push({ p, t0: time, drops, puddle, at: null });
  const el = $('yardSel');
  if (el) { el.textContent = '🤢 ' + tx('sick'); setTimeout(showYardSel, 4000); }
}
function updateSick(time) {
  for (let k = sickEvents.length - 1; k >= 0; k--) {
    const e = sickEvents[k], el = time - e.t0;
    if (!e.at) {                                 // where it lands: in front of their feet, on whatever ground is there
      e.at = e.p.pos.clone().addScaledVector(e.p.face, 0.55);
      // its own ray: the picking ray (rcY) must keep its full length, or nothing can be picked up any more
      const down = new THREE.Raycaster(e.at.clone().setY(3), new THREE.Vector3(0, -1, 0), 0, 4);
      const hit = down.intersectObjects(GROUNDS.filter(m => m.visible), false)[0];
      e.at.y = (hit ? hit.point.y : 0) + 0.012;
      e.puddle.position.copy(e.at);
    }
    e.p.f.body.children[1].getWorldPosition(headAt);
    const mouth = headAt.addScaledVector(e.p.face, 0.11).setY(headAt.y - 0.04);
    const pouring = el > 0.45 && el < SICK_FOR - 0.5;
    e.drops.forEach((m, i) => {
      m.visible = pouring;
      if (!pouring) return;
      const u = (el * 1.9 + i / e.drops.length) % 1;
      m.position.lerpVectors(mouth, e.at, u);
      m.position.y = mouth.y * (1 - u) * (1 - u) + e.at.y * u * u + 2 * u * (1 - u) * (mouth.y + 0.12);

    if (el > PUDDLE_FOR + 3) {

    }
  }
}

  for (const e of sickEvents) for (const m of [...e.drops, e.puddle]) { yardGroup.remove(m); m.geometry.dispose(); }
  sickEvents.length = 0;

}

const THUMB_W = 640, THUMB_H = 480;
async function drawThumbs() {
  if (thumbing) return;
  thumbing = true;
  for (const c of galCards) {
    if (!galOpen) break;
    if (c.done) continue;
    await new Promise(r => requestAnimationFrame(r));

// stage i as at its stop, from its own view, as a JPEG data URL; everything put back right after, so closing the
// gallery at any moment is safe. Also used at print size for the PDF of the workshops (scripts/workshop_pdf.py).
function stageImage(i, w = THUMB_W, h = THUMB_H, q = 0.84) {
  const keep = { t, pos: camera.position.clone(), quat: camera.quaternion.clone(), pr: renderer.getPixelRatio() };
  const ph = phases[i], z = ph.zone ? zones[ph.zone] : null;
  renderer.setPixelRatio(1);
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  t = i;
  const v = stageView(ph);
  camera.position.copy(v.pos);
  camera.lookAt(v.target);
  camera.updateMatrixWorld();
  updateScene(clock.elapsedTime + 1.5);
  yardUpdate(clock.elapsedTime + 1.5, 0);
  xrayFor(z);
  animateFades(1);
  renderer.render(scene, camera);
  const url = renderer.domElement.toDataURL('image/jpeg', q);
  t = keep.t;
  camera.position.copy(keep.pos);
  camera.quaternion.copy(keep.quat);
  renderer.setPixelRatio(keep.pr);
  resize();
  xrayKey = '';                                  // the loop works the x-ray out again for the real view
  return url;
}

function loop() {

  const dt = Math.min(clock.getDelta(), 0.05), time = clock.elapsedTime;

  else if (walk) { if (fly) camera.lookAt(controls.target); else updateWalk(dt, time); }   // the POV walk drives the camera
  else controls.update(dt);                      // dt: the presentation's slow spin keeps time on any screen rate

    camera.fov += (fovGoal - camera.fov) * (reduceMotion ? 1 : Math.min(1, dt * 2.5));
    if (Math.abs(fovGoal - camera.fov) < 0.05) camera.fov = fovGoal;
